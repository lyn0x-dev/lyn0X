<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 32" width="1200" height="32">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#25d366" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#25d366" stop-opacity="0.8"/>
      <stop offset="0.5" stop-color="#7dffb8"/>
      <stop offset="0.7" stop-color="#22d3ee" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="thin" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#25d366" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#25d366" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#25d366" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="streak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dffb8" stop-opacity="0"/>
      <stop offset="1" stop-color="#e8fff3" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="streakR" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#7dffb8" stop-opacity="0"/>
      <stop offset="1" stop-color="#e8fff3" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7dffb8"/>
      <stop offset="0.55" stop-color="#25d366"/>
      <stop offset="1" stop-color="#0ea5a0"/>
    </linearGradient>
    <filter id="glow" x="-300%" y="-300%" width="700%" height="700%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- main line -->
  <rect x="0" y="15" width="1200" height="2" rx="1" fill="url(#line)"/>
  <rect x="150" y="9" width="390" height="1" fill="url(#thin)"/>
  <rect x="660" y="9" width="390" height="1" fill="url(#thin)"/>
  <rect x="150" y="22" width="390" height="1" fill="url(#thin)"/>
  <rect x="660" y="22" width="390" height="1" fill="url(#thin)"/>

  <!-- chat-bubble ticks -->
  <g fill="#25d366" fill-opacity="0.55">
    <rect x="236" y="11" width="14" height="10" rx="4"/>
    <rect x="330" y="12" width="9" height="8" rx="3"/>
    <rect x="410" y="11" width="14" height="10" rx="4"/>
    <rect x="950" y="11" width="14" height="10" rx="4"/>
    <rect x="861" y="12" width="9" height="8" rx="3"/>
    <rect x="776" y="11" width="14" height="10" rx="4"/>
  </g>

  <!-- travelling packets -->
  <rect y="14.5" width="80" height="3" rx="1.5" fill="url(#streak)">
    <animate attributeName="x" values="60;510;510" keyTimes="0;0.7;1" dur="3.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.65;0.7" dur="3.2s" repeatCount="indefinite"/>
  </rect>
  <rect y="14.5" width="80" height="3" rx="1.5" fill="url(#streakR)">
    <animate attributeName="x" values="1060;610;610" keyTimes="0;0.7;1" dur="3.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.65;0.7" dur="3.2s" repeatCount="indefinite"/>
  </rect>

  <!-- center emblem: hexagon with X -->
  <g transform="translate(600 16)">
    <circle r="12" fill="none" stroke="#25d366" stroke-width="1.5">
      <animate attributeName="r" values="11;19;11" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.8;0;0.8" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <path d="M-42 -7 L-50 0 L-42 7" fill="none" stroke="#25d366" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M42 -7 L50 0 L42 7" fill="none" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="-32" y="-2" width="4" height="4" rx="1" fill="#25d366" opacity="0.8"/>
    <rect x="28" y="-2" width="4" height="4" rx="1" fill="#22d3ee" opacity="0.8"/>
    <path d="M0 -13 L11.3 -6.5 V6.5 L0 13 L-11.3 6.5 V-6.5 Z" fill="#25d366" opacity="0.6" filter="url(#glow)"/>
    <path d="M0 -12 L10.4 -6 V6 L0 12 L-10.4 6 V-6 Z" fill="#03120c" stroke="url(#core)" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M-4.5 -4.5 L4.5 4.5 M4.5 -4.5 L-4.5 4.5" stroke="url(#core)" stroke-width="2.4" stroke-linecap="round">
      <animate attributeName="opacity" values="1;0.45;1" dur="2.6s" repeatCount="indefinite"/>
    </path>
  </g>

  <circle cx="150" cy="16" r="2.5" fill="#25d366" opacity="0.85"/>
  <circle cx="1050" cy="16" r="2.5" fill="#22d3ee" opacity="0.85"/>
</svg>
